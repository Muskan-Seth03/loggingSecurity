name: Java CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: studentlogindb
          MYSQL_ROOT_PASSWORD: 1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p1234 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # -----------------------------------------
      # 1. Checkout source code
      # -----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------
      # 2. Setup JDK 21
      # -----------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------------------
      # 3. Build and Run Unit Tests
      # -----------------------------------------
      - name: Build and Test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/studentlogindb?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 1234
        run: |
          mvn clean verify

      # -----------------------------------------
      # 4. Generate / Verify JaCoCo Coverage
      # -----------------------------------------
      - name: Generate JaCoCo Coverage Report
        run: |
          mvn jacoco:report

      # -----------------------------------------
      # 5. Check Code Coverage >= 20%
      # -----------------------------------------
      - name: Check Code Coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          report = "target/site/jacoco/jacoco.xml"

          try:
              tree = ET.parse(report)
          except FileNotFoundError:
              print("ERROR: JaCoCo report not found:")
              print(report)
              sys.exit(1)

          root = tree.getroot()
          instruction_counter = None

          for counter in root.findall("counter"):
              if counter.attrib.get("type") == "INSTRUCTION":
                  instruction_counter = counter
                  break

          if instruction_counter is None:
              print("ERROR: INSTRUCTION coverage data not found.")
              sys.exit(1)

          missed = int(instruction_counter.attrib["missed"])
          covered = int(instruction_counter.attrib["covered"])
          total = missed + covered

          if total == 0:
              print("ERROR: No instructions found in JaCoCo report.")
              sys.exit(1)

          coverage = (covered / total) * 100
          required = 20.0

          print(f"Code Coverage: {coverage:.2f}%")
          print(f"Required Coverage: {required:.2f}%")

          if coverage < required:
              print("QUALITY GATE FAILED")
              print("Code coverage is below the current project baseline.")
              sys.exit(1)

          print("QUALITY GATE PASSED")
          print("Code coverage meets the project baseline.")
          PY

      # -----------------------------------------
      # 6. SonarQube Analysis
      # -----------------------------------------
      - name: SonarQube Analysis
        if: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -----------------------------------------
      # 7. SonarQube Quality Gate
      # -----------------------------------------
      - name: SonarQube Quality Gate
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # -----------------------------------------
      # 8. Package Application
      # -----------------------------------------
      - name: Package JAR
        run: |
          mvn package -DskipTests

      # -----------------------------------------
      # 9. Upload JAR
      # -----------------------------------------
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-application
          path: target/*.jar

      # -----------------------------------------
      # 10. Upload JaCoCo Report
      # -----------------------------------------
      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
